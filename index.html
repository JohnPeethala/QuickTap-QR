<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickTap QR | Premium QR Suite</title>
    
    <!-- Fonts & Libraries -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <style>
        :root {
            --bg: #f8fafc;
            --text: #0f172a;
            --card: #ffffff;
            --card-border: rgba(0, 0, 0, 0.05);
            --card-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
            --input-bg: #ffffff;
            --input-border: #e2e8f0;
            --grid-color: rgba(0, 0, 0, 0.05);
        }

        body.dark {
            --bg: #0a0a0a;
            --text: #f8fafc;
            --card: #141414;
            --card-border: rgba(255, 255, 255, 0.05);
            --card-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            --input-bg: #1a1a1a;
            --input-border: #262626;
            --grid-color: rgba(255, 255, 255, 0.03);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 40px 40px;
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            transition: background-color 0.4s ease;
        }

        /* --- Header & Navigation (Symmetrical Widgets) --- */
        .nav-container {
            position: fixed;
            top: 24px;
            left: 24px;
            right: 24px;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }

        .controls {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 12px;
            pointer-events: auto;
            transition: all 0.3s ease;
        }

        /* The Base Widget Style (Synced) */
        .widget-card {
            width: 56px;
            height: 56px;
            background-color: var(--card);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--card-border);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            flex-shrink: 0;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
            pointer-events: auto;
        }

        /* Base Widget / Card Style */
        .brand-card, .widget-card {
            background-color: var(--card);
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--card-border);
            transition: all 0.3s ease;
            height: 56px;
            display: flex;
            align-items: center;
            pointer-events: auto;
        }

        .brand-card {
            padding: 0 24px 0 0;
            gap: 4px; /* Reduced gap for tighter integration */
        }

        .widget-card {
            width: 56px;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .brand-icon {
            width: 56px;
            height: 56px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            color: var(--text);
        }

        .brand-icon svg {
            width: 32px;
            height: 32px;
            stroke-width: 2.2;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.1));
        }

        .brand-name {
            font-size: 1.4rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            color: var(--text);
            white-space: nowrap;
        }

        /* Icon Scales (Synced) */
        .widget-card svg {
            width: 32px;
            height: 32px;
            stroke-width: 2.2;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.1));
            transition: transform 0.3s ease;
            transform-origin: center;
        }

        .widget-card:hover svg {
            transform: scale(1.05);
        }

        .control-btn {
            background-color: var(--card);
            color: var(--text);
            border: 1px solid var(--card-border);
        }

        /* --- Main Content --- */
        .main-content {
            flex: 1;
            padding: 120px 24px 40px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .input-view {
            display: flex;
            gap: 32px;
            width: 100%;
            max-width: 900px;
            justify-content: center;
            flex-wrap: wrap;
            align-items: flex-start; /* Prevents cards from matching each other's expanded height */
        }

        /* --- Components --- */
        .card {
            background-color: var(--card);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--card-border);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.12);
        }

        .input-label {
            font-size: 0.75rem;
            font-weight: 800;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .input-field {
            width: 100%;
            padding: 18px 24px;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 500;
            color: var(--text);
            outline: none;
            transition: all 0.2s ease;
        }

        .input-field:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        /* Integrated QR Display */
        .qr-results {
            display: none;
            flex-direction: column;
            gap: 16px;
            margin-top: 10px;
            animation: slideUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        .qr-item {
            background-color: var(--bg);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            position: relative;
            border: 1px solid var(--card-border);
        }

        .qr-item canvas {
            width: 100% !important;
            max-width: 200px;
            height: auto !important;
            border-radius: 8px;
            padding: 4px;
            background: white;
        }

        .qr-item span {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text);
        }

        .qr-share-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--card);
            border: 1px solid var(--card-border);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: var(--text);
            transition: all 0.2s ease;
        }

        /* --- Animations --- */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* --- Mobile Optimization (Native App Feel) --- */
        @media (max-width: 768px) {
            .nav-container {
                top: 16px;
                left: 16px;
                right: 16px;
            }

            .widget-card {
                width: 44px;
                height: 44px;
                border-radius: 12px;
            }

            .widget-card svg {
                width: 24px;
                height: 24px;
                stroke-width: 2.5;
            }

            .brand-name {
                display: none;
            }

            .brand-card {
                width: 44px;
                height: 44px;
                padding: 0;
                justify-content: center;
                border-radius: 12px;
            }

            .main-content {
                padding: 100px 20px 40px 20px;
                justify-content: flex-start; /* Better for scrolling lists */
            }

            .card {
                padding: 32px 20px;
                border-radius: 20px;
                max-width: 100%;
            }

            .input-view {
                gap: 24px;
                width: 100%;
            }

            .input-field {
                font-size: 1.05rem; /* Better mobile tap target */
                padding: 16px 20px;
            }

            .qr-item {
                padding: 20px;
                border-radius: 14px;
            }

            .card:first-child {
                display: none;
            }
        }

        /* Safe Area Support */
        @supports (padding: env(safe-area-inset-top)) {
            .nav-container {
                top: calc(16px + env(safe-area-inset-top));
                left: calc(16px + env(safe-area-inset-left));
                right: calc(16px + env(safe-area-inset-right));
            }
        }

        /* Theme Icon Visibility */
        .sun-icon { display: none; }
        .moon-icon { display: block; }
        body.dark .sun-icon { display: block; }
        body.dark .moon-icon { display: none; }
    </style>
</head>

<body>

    <nav class="nav-container">
        <div class="brand-card">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <rect x="7" y="7" width="3" height="3"></rect>
                    <rect x="14" y="7" width="3" height="3"></rect>
                    <rect x="7" y="14" width="3" height="3"></rect>
                    <rect x="14" y="14" width="3" height="3"></rect>
                </svg>
            </div>
            <h1 class="brand-name">QuickTap QR</h1>
        </div>

        <div class="controls">
            <button class="widget-card control-btn" id="appShareBtn" title="Share App">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
            </button>
            <button class="widget-card control-btn" id="themeToggle" title="Toggle Theme">
                <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
        </div>
    </nav>

    <main class="main-content">
        <div class="input-view">
            <!-- Phone Card -->
            <div class="card" id="phoneCard">
                <div class="input-group">
                    <span class="input-label">Quick Dialer</span>
                    <input type="text" id="phoneInput" class="input-field" placeholder="Enter phone number..." autocomplete="off">
                </div>
                <div class="qr-results" id="phoneResults">
                    <div class="qr-item">
                        <button class="qr-share-btn" onclick="shareQR('dialer')">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
                        </button>
                        <canvas id="qrDialer"></canvas>
                        <span>Standard Dialer</span>
                    </div>
                    <div class="qr-item">
                        <button class="qr-share-btn" onclick="shareQR('whatsapp')">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
                        </button>
                        <canvas id="qrWhatsapp"></canvas>
                        <span>WhatsApp Chat</span>
                    </div>
                </div>
            </div>

            <!-- Text Card -->
            <div class="card" id="textCard">
                <div class="input-group">
                    <span class="input-label">Text & Links</span>
                    <input type="text" id="textInput" class="input-field" placeholder="Paste link or text..." autocomplete="off">
                </div>
                <div class="qr-results" id="textResults">
                    <div class="qr-item">
                        <button class="qr-share-btn" onclick="shareQR('text')">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
                        </button>
                        <canvas id="qrText"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // --- System Logic ---
        const body = document.body;
        const themeToggle = document.getElementById('themeToggle');
        
        // Load Theme
        if (localStorage.getItem('theme') === 'dark') body.classList.add('dark');
        
        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark');
            localStorage.setItem('theme', body.classList.contains('dark') ? 'dark' : 'light');
        });

        // --- Cinematic Entrance ---
        window.addEventListener('DOMContentLoaded', () => {
            gsap.set([".brand-card", ".controls", ".card"], { opacity: 0 });
            
            const isMobile = window.innerWidth <= 768;
            const duration = isMobile ? 0.35 : 0.7; /* Significantly faster */
            const stagger = isMobile ? 0.05 : 0.1;

            const tl = gsap.timeline({ defaults: { ease: "expo.out", duration: duration } });
            
            tl.to(".brand-card", { x: 0, opacity: 1, startAt: { x: isMobile ? -15 : -30 } })
              .to(".controls", { x: 0, opacity: 1, startAt: { x: isMobile ? 15 : 30 } }, "-=0.3")
              .to(".card", { y: 0, opacity: 1, startAt: { y: isMobile ? 15 : 30 }, stagger: stagger }, "-=0.2");
        });

        // --- QR Generation Engine ---
        const qrDialer = new QRious({ element: document.getElementById('qrDialer'), size: 400, padding: 0, foreground: '#000000', background: '#ffffff' });
        const qrWhatsapp = new QRious({ element: document.getElementById('qrWhatsapp'), size: 400, padding: 0, foreground: '#000000', background: '#ffffff' });
        const qrText = new QRious({ element: document.getElementById('qrText'), size: 400, padding: 0, foreground: '#000000', background: '#ffffff' });

        const phoneInput = document.getElementById('phoneInput');
        const textInput = document.getElementById('textInput');
        const phoneResults = document.getElementById('phoneResults');
        const textResults = document.getElementById('textResults');
        const textLabel = document.getElementById('textLabel');

        // Phone Logic
        phoneInput.addEventListener('input', (e) => {
            const val = e.target.value.replace(/\D/g, '');
            if (val.length >= 10) {
                const cleanNum = val.slice(-10);
                qrDialer.value = `tel:${cleanNum}`;
                qrWhatsapp.value = `https://wa.me/91${cleanNum}`;
                phoneResults.style.display = 'flex';
            } else {
                phoneResults.style.display = 'none';
            }
        });

        // Text Logic
        textInput.addEventListener('input', (e) => {
            const val = e.target.value.trim();
            if (val.length > 0) {
                qrText.value = val;
                textResults.style.display = 'flex';
                
                // Centering shift for mobile
                if (window.innerWidth < 768) {
                    setTimeout(() => textResults.scrollIntoView({ behavior: 'smooth', block: 'center' }), 100);
                }
            } else {
                textResults.style.display = 'none';
            }
        });

        // --- Sharing ---
        const appShareBtn = document.getElementById('appShareBtn');
        if (!navigator.share) {
            appShareBtn.style.display = 'none';
            document.querySelectorAll('.qr-share-btn').forEach(b => b.style.display = 'none');
        }

        appShareBtn.addEventListener('click', () => {
            navigator.share({ title: 'QuickTap QR', url: window.location.href });
        });

        function shareQR(type) {
            let data = { title: 'QuickTap QR' };
            if (type === 'text') data.text = textInput.value;
            if (type === 'dialer') data.url = `tel:${phoneInput.value.slice(-10)}`;
            if (type === 'whatsapp') data.url = `https://wa.me/91${phoneInput.value.slice(-10)}`;
            navigator.share(data);
        }
    </script>
</body>

</html>
